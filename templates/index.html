<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payslip System</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Employee Payslip Generation System</h1>
        <h2>Add Employee Details</h2>

        <form action="/add_employee" method="POST">
            <label>Employee ID</label>
            <input type="text" name="employee_id" required>

            <label>Employee Name</label>
            <input type="text" name="name" required>

            <label>Designation</label>
            <input type="text" name="designation" required>

            <label>Joining Date</label>
            <input type="date" name="joining_date" required>

            <label>Basic Monthly Salary (₹)</label>
            <input type="number" name="basic_salary"
                   min="0.01" step="0.01" required>

            <label>HRA (%)</label>
            <input type="number" name="hra" min="0" step="0.01" required>

            <label>DA (%)</label>
            <input type="number" name="da" min="0" step="0.01" required>

            <label>Other Allowances (%)</label>
            <input type="number" name="allowances"
                   min="0" step="0.01" required>

            <label>PF (%)</label>
            <input type="number" name="pf" min="0" step="0.01" required>

            <label>ESI (%)</label>
            <input type="number" name="esi" min="0" step="0.01" required>

            <button type="submit">Save Employee</button>
        </form>
    </div>


<h2>Generate Payslip</h2>

<form action="/generate_payslip" method="POST">
    <label>Select Employee</label>
    <select name="employee_id" required>
        {% for employee in employees %}
        <option value="{{ employee.employee_id }}">
            {{ employee.name }} ({{ employee.employee_id }})
        </option>
        {% endfor %}
    </select>

    <label>Salary Month</label>
    <input type="month" name="month" required>

    <label>Unpaid Leave Days</label>
    <input type="number" name="leave_days"
           min="0" max="30" value="0" required>

    <button type="submit">Generate Payslip</button>
</form>


<h2>Employee Records</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Designation</th>
        <th>Basic Salary</th>
        <th>Actions</th>
    </tr>

    {% for employee in employees %}
    <tr>
        <td>{{ employee.employee_id }}</td>
        <td>{{ employee.name }}</td>
        <td>{{ employee.designation }}</td>
        <td>₹{{ "%.2f"|format(employee.basic_salary) }}</td>
        <td>
            <a href="{{ url_for('edit_employee',
                employee_id=employee.employee_id) }}">
                <button type="button" class="edit-btn">Edit</button>
            </a>

            <form action="{{ url_for('delete_employee',
                employee_id=employee.employee_id) }}"
                method="POST"
                onsubmit="return confirm('Are you sure you want to delete this employee?');">

                <button type="submit" class="delete-btn">
                    Delete
                </button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>


</body>
</html>
